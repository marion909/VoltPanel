name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write # für die Signatur über cosign (keyless)
  pages: write # für die Bezugsquelle get.voltpanel.dev

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # GoReleaser braucht die Historie für das Changelog

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: sigstore/cosign-installer@v3

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # GoReleaser baut die Archive für Menschen. install.sh und `volt update`
      # laden dagegen einzelne Dateien: das nackte Binary, eine Prüfsumme
      # daneben und latest.json. Die entstehen hier und werden ans selbe
      # Release gehängt.
      - name: Kanal-Artefakte anhängen
        run: scripts/release-assets.sh "$GITHUB_REF_NAME"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Die Bezugsquelle liegt bewusst nicht auf einem VoltPanel-Server: sonst
  # bräuchte man ein laufendes Panel, um ein Panel zu installieren.
  pages:
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Seite bauen
        run: scripts/build-pages.sh "$GITHUB_REF_NAME"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/pages
      - id: deploy
        uses: actions/deploy-pages@v5
