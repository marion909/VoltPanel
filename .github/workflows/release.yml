name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write # für die Signatur über cosign (keyless)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # GoReleaser braucht die Historie für das Changelog

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: sigstore/cosign-installer@v3

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # GoReleaser baut die Archive für Menschen. install.sh und `volt update`
      # laden dagegen einzelne Dateien: das nackte Binary, eine Prüfsumme
      # daneben und latest.json. Die entstehen hier und werden ans selbe
      # Release gehängt.
      - name: Kanal-Artefakte anhängen
        run: scripts/release-assets.sh "$GITHUB_REF_NAME"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signiert latest.json. Ohne eines dieser Secrets bleibt die Datei
          # unsigniert; `volt update` lehnt den Kanal dann ab und install.sh
          # bricht ab — beide mit einer Meldung, die sagt warum.
          #
          # RELEASE_SIGNING_KEY ist der einfache Weg: ein blanker EC-Schluessel
          # im PEM-Format, wie openssl ihn in zwei Zeilen erzeugt. Der
          # cosign-Weg bleibt daneben stehen, fuer den, der cosign ohnehin
          # benutzt. Siehe docs/release.md.
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
