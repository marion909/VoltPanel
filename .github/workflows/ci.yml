name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test und Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Formatierung prüfen
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then
            echo "Nicht formatiert:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Tests mit Race-Detector
        run: go test -race ./...

      # Ein verlorenes x-Bit faellt sonst erst im Release-Lauf auf, und zwar
      # mit "Permission denied" statt mit einer brauchbaren Meldung.
      - name: Skripte ausführbar und syntaktisch heil
        run: make lint-scripts

      # Ohne mindestens eine Datei unter internal/webui/dist scheitert
      # //go:embed - und zwar vor gofmt, vet und jedem Test.
      - name: Embed-Verzeichnis vorhanden
        run: make lint-embed

      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          # Volle Strenge, inklusive info und style. Ein heruntergesetzter
          # Schweregrad hat hier schon einmal einen echten Fehler verdeckt:
          # SC2006 meldete Backticks, die in einem nicht gequoteten Heredoc
          # standen und dort ausgefuehrt wurden. Ausnahmen gehoeren an die
          # betroffene Zeile, nicht in den Aufruf.
          shellcheck $(git ls-files '*.sh')

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: ./scripts/build-web.sh

      - name: Bundle-Größe berichten
        run: du -sh internal/webui/dist && ls -la internal/webui/dist/assets

  build:
    name: Build linux/${{ matrix.arch }}
    runs-on: ubuntu-latest
    needs: [test, frontend]
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - run: ./scripts/build-web.sh

      - name: Binaries bauen
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: |
          go build -trimpath -ldflags "-s -w" -o volt ./cmd/volt
          go build -trimpath -ldflags "-s -w" -o volt-agent ./cmd/volt-agent

      - name: Statisches Binary sicherstellen
        # Eine dynamisch gelinkte Datei würde die Installation aus einem
        # einzigen Binary hinfällig machen.
        run: |
          if file volt | grep -q "dynamically linked"; then
            echo "volt ist dynamisch gelinkt"; file volt; exit 1
          fi
          file volt volt-agent

      - uses: actions/upload-artifact@v6
        with:
          name: voltpanel-linux-${{ matrix.arch }}
          path: |
            volt
            volt-agent
          retention-days: 7
